name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: directory
          POSTGRES_PASSWORD: directory
          POSTGRES_DB: directory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U directory -d directory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://directory:directory@localhost:5432/directory
      DB_DRIVER: node
      SKIP_ENV_VALIDATION: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify schema is in sync with migrations
        run: npx drizzle-kit check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
