# Local Postgres with PostGIS for development, tests and CI.
# Neon is used for preview/production; this image matches the extensions we rely
# on (postgis, pg_trgm, unaccent, fuzzystrmatch).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: directory
      POSTGRES_DB: directory
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U directory -d directory']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
